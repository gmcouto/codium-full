name: Build, Smoke Test & Publish to GHCR

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  smoke-test-gate:
    name: Multi-Platform Smoke Test Gate
    uses: ./.github/workflows/smoke-test.yml

  publish-ghcr:
    name: Build & Publish Multi-Arch Image to GHCR
    needs: smoke-test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare AI tools candidate resolution
        run: |
          ./scripts/prepare-ai-tools-resolution.sh

      - name: Determine Target Tag
        id: target-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gmcouto/codium-full
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.target-tag.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.target-tag.outputs.tag }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify published multi-architecture manifest
        env:
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${PUBLISHED_TAGS}; do
            echo "Verifying manifest for ${tag}..."
            docker buildx imagetools inspect "${tag}"
          done
