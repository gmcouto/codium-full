name: Release Authoring

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target SemVer version (e.g. v1.0.0 or 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark this release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  author-release:
    name: Author Release & Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SemVer Input
        id: semver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Invalid SemVer format '${VERSION}'" >&2
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^v ]]; then
            TAG="v${VERSION}"
          else
            TAG="${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate Upstream Changelogs
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          ./scripts/generate-release-notes.sh \
            --target-version "${TAG}" \
            --output /tmp/release-notes.md

      - name: Create Git Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          EXTRA_FLAGS=()
          if [ "${IS_PRERELEASE}" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi
          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            --notes-file /tmp/release-notes.md \
            "${EXTRA_FLAGS[@]}"

      - name: Trigger Multi-Platform Publish Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          echo "Triggering publish workflow for tag ${TAG}..."
          gh workflow run publish.yml --ref "${TAG}" -f tag="${TAG}" || {
            echo "Direct dispatch failed or not needed; push event will handle if PAT was used."
          }
