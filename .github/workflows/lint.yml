name: Static PR Linting

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  static-lint:
    name: Fast Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        # Local binary instead of hadolint/hadolint-action: the action builds
        # a Docker image FROM ghcr.io/hadolint/hadolint, whose anonymous
        # GHCR token exchange is denied from some self-hosted DinD runners,
        # and the leftover GHCR job credentials in ~/.docker/config.json
        # make BuildKit send a stale PAT that GHCR rejects. The runner
        # image ships hadolint; fall back to the official release binary.
        run: |
          if ! command -v hadolint >/dev/null 2>&1; then
            curl -fsSL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
            sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint || install -m 0755 /tmp/hadolint "$HOME/.local/bin/hadolint" || true
            export PATH="$HOME/.local/bin:$PATH"
          fi
          hadolint --version
          hadolint --config .hadolint.yaml Dockerfile

      - name: Lint Shell Scripts (ShellCheck)
        run: |
          shellcheck --version
          DISABLE_CODES=$(grep '^disable=' .shellcheckrc | cut -d= -f2)
          # rootfs bin list: npm shim was removed in e810408 (native npm);
          # keep only files that exist so shellcheck does not exit 2 on a
          # missing path (pre-existing failure also on hosted runners).
          shellcheck -e "${DISABLE_CODES}" -x scripts/*.sh rootfs/etc/profile.d/*.sh rootfs/usr/local/bin/npx rootfs/usr/local/bin/yarn

      - name: Lint GitHub Workflows (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Validate Docker Compose Configuration
        run: |
          TEST_PASSWORD=mockpassword docker compose -f docker-compose.test.yml config -q

      - name: Validate JSON Configuration Files
        run: |
          find . -maxdepth 1 -name '*.json' -exec jq empty {} +
          find ai-tools rootfs -name '*.json' -exec jq empty {} +
