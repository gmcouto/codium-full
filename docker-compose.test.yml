services:
  codium-full:
    build:
      context: .
      dockerfile: Dockerfile
    image: codium-full:test
    container_name: codium-full-test
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      PASSWORD: "${TEST_PASSWORD:?Set TEST_PASSWORD to a non-default test secret}"
    volumes:
      - codium_test_config:/config
      - ./scripts:/scripts:ro
    ports:
      - "127.0.0.1:${TEST_PORT:-8443}:8443"
      - "127.0.0.1:${TEST_SSH_PORT:-2222}:2222"
    restart: unless-stopped

volumes:
  codium_test_config:
